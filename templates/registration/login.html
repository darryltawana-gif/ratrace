{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Login</h2>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn" style="width:100%;margin-top:8px">Login</button></form>
  <p class="muted" style="margin-top:14px">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
