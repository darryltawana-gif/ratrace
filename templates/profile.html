{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>📷 Seller profile photo</h2>
  {% if profile.photo %}<img class="avatar" style="width:110px;height:110px" src="{{ profile.photo.url }}">{% endif %}
  <form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button class="btn" style="width:100%;margin-top:8px">Save</button></form>
</div>
{% endblock %}
